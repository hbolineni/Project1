<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101323">
  <meta name="description" content="Get in touch and say hello.">
  <title>Contact Us— A little web magic</title>
  <style>
    :root { color-scheme: dark; --ink: #f8f7ff; --muted: #b8bad0; --cyan: #67e8f9; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 6rem 1rem 4rem;
      color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at 18% 20%, rgba(124,58,237,.25), transparent 38%), radial-gradient(ellipse at 84% 78%, rgba(6,182,212,.18), transparent 36%), #101323;
    }
    .orb { position: fixed; width: 26rem; aspect-ratio: 1; border-radius: 50%; filter: blur(100px); opacity: .24; pointer-events: none; animation: drift 12s ease-in-out infinite alternate; }
    .one { background: #8b5cf6; top: -12rem; left: -8rem; } .two { background: #06b6d4; bottom: -15rem; right: -9rem; animation-delay: -5s; }
    .nav { position: fixed; z-index: 2; top: 1.25rem; left: 50%; display: flex; gap: .35rem; padding: .35rem; border: 1px solid rgba(255,255,255,.13); border-radius: 999px; background: rgba(16,19,35,.65); backdrop-filter: blur(14px); transform: translateX(-50%); }
    .nav a { padding: .65rem 1rem; border-radius: 999px; color: var(--muted); font-size: .88rem; font-weight: 650; text-decoration: none; transition: color .2s ease, background .2s ease; }
    .nav a:hover, .nav a[aria-current="page"] { color: var(--ink); background: rgba(255,255,255,.1); }
    .nav a:focus-visible, .text-link:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
    main { position: relative; width: min(90vw, 760px); padding: clamp(2.5rem, 8vw, 5rem); border: 1px solid rgba(255,255,255,.14); border-radius: 32px; background: linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.035)); box-shadow: 0 32px 100px rgba(0,0,0,.35), inset 0 1px rgba(255,255,255,.12); backdrop-filter: blur(20px); animation: arrive .9s cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow { margin: 0 0 1rem; color: var(--muted); font-size: .76rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3rem, 9vw, 5.5rem); line-height: 1; letter-spacing: -.07em; }
    h1 span { color: transparent; background: linear-gradient(100deg, #c4b5fd 5%, #f0abfc 48%, #67e8f9 95%); background-clip: text; -webkit-background-clip: text; }
    .copy { max-width: 570px; margin: 1.5rem 0 0; color: var(--muted); font-size: clamp(1rem, 2.5vw, 1.12rem); line-height: 1.85; }
    .text-link { display: inline-flex; align-items: center; gap: .55rem; margin-top: 2rem; color: #d7ccff; font-weight: 700; text-decoration: none; }
    .text-link:hover { color: var(--cyan); }
    footer { position: fixed; bottom: 1.5rem; color: rgba(220,222,241,.53); font-size: .76rem; letter-spacing: .08em; }
    @keyframes arrive { from { opacity: 0; transform: translateY(22px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes drift { to { transform: translate(45px,35px) scale(1.13); } }
    @media (max-width: 480px) { .nav { top: .8rem; } footer { bottom: .8rem; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="orb one" aria-hidden="true"></div><div class="orb two" aria-hidden="true"></div>
  <nav class="nav" aria-label="Main navigation">
    <a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a><a href="gallery.html">Gallery</a>
  </nav>
  <main>
    <p class="eyebrow">Let’s connect</p>
    <h1>Say <span>hello.</span></h1>
    <p class="copy">Have a question, an idea, or just want to say hi? I’d love to hear from you.</p>
    <p class="copy">Add your preferred email address or social links here so visitors know how to reach you.</p>
    <a class="text-link" href="about.html">More about this page <span aria-hidden="true">→</span></a>
  </main>
  <footer>MADE WITH A LITTLE SPARK ✨</footer>
</body>
</html>
